name: Deploy to MonsterASP
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Copy frontend into API wwwroot
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src/SubscriptionBilling.API/wwwroot | Out-Null
          Copy-Item -Recurse -Force frontend/dist/* src/SubscriptionBilling.API/wwwroot/

      - name: Run tests
        run: dotnet test tests/SubscriptionBilling.Tests -c Release

      - name: Publish API
        run: dotnet publish src/SubscriptionBilling.API -c Release -o publish

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./publish/
          server-dir: /wwwroot/
