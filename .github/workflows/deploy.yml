name: Build and Deploy to MonsterASP.NET

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          dotnet-version: '8.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install and Build Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build -- --configuration production

      - name: Copy Frontend Build to API wwwroot
        shell: pwsh
        run: |
          $target = "src/SubscriptionBilling.API/wwwroot"
          if (!(Test-Path $target)) { New-Item -ItemType Directory -Path $target -Force }
          Copy-Item -Path "frontend/dist/frontend/*" -Destination $target -Recurse -Force
          if (!(Test-Path "$target/index.html")) {
            throw "Error: index.html not found in $target. Frontend build failed or output path mismatch."
          }
          Write-Host "Frontend build successfully placed in $target"

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        run: dotnet restore SubscriptionBilling.slnx

      - name: Run Unit & Integration Tests
        run: dotnet test tests/SubscriptionBilling.Tests/SubscriptionBilling.Tests.csproj --configuration Release --no-restore --verbosity normal

      - name: Publish ASP.NET Core API
        shell: pwsh
        run: |
          dotnet publish src/SubscriptionBilling.API/SubscriptionBilling.API.csproj --configuration Release --no-restore --output ./publish
          # Create logs directory for IIS stdout logging if not already present
          if (!(Test-Path "./publish/logs")) {
            New-Item -ItemType Directory -Path "./publish/logs" -Force
          }

      - name: Deploy via FTP to MonsterASP.NET
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /wwwroot/
          local-dir: ./publish/
          protocol: ftp
          exclude: |
            **appsettings.Production.json
            **logs/**
