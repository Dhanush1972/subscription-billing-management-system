name: Build and Deploy to MonsterASP.NET

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install and Build Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build -- --configuration production

      - name: Copy Frontend Build to API wwwroot
        shell: pwsh
        run: |
          $index = Get-ChildItem -Path frontend/dist -Recurse -Filter index.html | Select-Object -First 1
          if (-not $index) { throw "index.html not found anywhere under frontend/dist" }
          $source = $index.DirectoryName
          Write-Host "Using build output: $source"
          $target = "src/SubscriptionBilling.API/wwwroot"
          New-Item -ItemType Directory -Path $target -Force | Out-Null
          Copy-Item -Path "$source/*" -Destination $target -Recurse -Force

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore Dependencies
        run: dotnet restore SubscriptionBilling.slnx

      - name: Run Unit & Integration Tests
        run: dotnet test tests/SubscriptionBilling.Tests/SubscriptionBilling.Tests.csproj --configuration Release --no-restore --verbosity normal

      - name: Publish ASP.NET Core API
        run: dotnet publish src/SubscriptionBilling.API/SubscriptionBilling.API.csproj --configuration Release --no-restore --output ./publish

      - name: Take site offline (release file locks)
        shell: pwsh
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          Set-Content -Path app_offline.htm -Value "<html><body><h2>Updating, back in a minute...</h2></body></html>"
          curl.exe -sS --fail -T app_offline.htm "ftp://$env:FTP_SERVER/wwwroot/app_offline.htm" --user "${env:FTP_USERNAME}:${env:FTP_PASSWORD}"
          Start-Sleep -Seconds 15

      - name: Deploy via FTP to MonsterASP.NET
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /wwwroot/
          local-dir: ./publish/
          protocol: ftp
          exclude: |
            **/appsettings.Production.json
            **/logs/**

      - name: Bring site back online
        if: always()
        shell: pwsh
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          curl.exe -sS "ftp://$env:FTP_SERVER/" --user "${env:FTP_USERNAME}:${env:FTP_PASSWORD}" -Q "DELE /wwwroot/app_offline.htm"
